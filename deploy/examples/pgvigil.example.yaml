# pgvigil configuration. Secrets stay out of this file: write a value as
#   env:NAME     read from the environment
#   file:/path   read from a file (one line)
repository:
  dsn: env:PGVIGIL_REPO_DSN          # postgres://pgvigil:...@repo-host:5432/pgvigil

# Global overrides of a collection's default interval; "disabled" turns one off everywhere.
schedules:
  instance: 1h
  # iostats: 1m                     # pg_stat_io (PG16+) every minute instead of every 5: about three times the
  #                                  repository storage per instance (the README's Sizing section)

# What statement text the repository may hold (an instance can override it):
#   full        the text as the server shows it (credentials always masked)
#   normalized  every literal replaced by ? before the text leaves the collector
#   none        no statement text at all, only hashes and counters
query_text: full

# The UI's tree: one folder level per tag key, in order (a tag is a plain word or key:value, below);
# env_order ranks the values of every level, prod first; the rest follow by name.
ui:
  group_by: [env, team]
  env_order: [prod, staging, dev]

# A host that only serves the UI (pgvigil serve, pgvigil user, pgvigil migrate) may leave this list empty.
instances:
  - name: prod-writer
    dsn: env:PROD_WRITER_DSN           # host=... user=pgvigil dbname=postgres sslmode=require
    platform: auto                     # auto | onprem | rds | aurora | azure | cloudsql | alloydb
    tags: [prod, aurora, env:prod, team:orders]   # plain words (key `tag`) and key:value pairs; `pgvigil tag` overrides them in the repository
    # actions_dsn: env:PROD_WRITER_ACTIONS_DSN  # the cancel / terminate door: the login pgvigil_actions holding pg_signal_backend
    #                                  # only (pgvigil roles prints it); absent = the buttons stay off on this instance
    # explain_analyze: true            # the Plan page's EXPLAIN ANALYZE on this instance (it executes the SELECT, read-only, rolled back)
    # explain_dsn: env:PROD_EXPLAIN_DSN # the login it runs as: SELECT grants only, never pgvigil_actions (pgvigil roles prints it)
    # explain_timeout: 30s              # one EXPLAIN ANALYZE at most (5m is the ceiling)
    # backups:
    #   archive_warn_minutes: 60         # the last archived WAL older than this while WAL waits is a finding
    schedules:
      instance: 30m
    # The AWS door of an RDS / Aurora instance: the postgresql log over CloudWatch Logs (logs) and the
    # DMS tasks that feed or read this instance (dms). Credentials come from the SDK's usual chain
    # (an aws login session, a profile, an instance role); nothing is stored here.
    # aws:
    #   region: us-east-2
    #   profile: prod-readonly           # optional
    #   cluster: prod-pg                 # Aurora: the cluster id; RDS: db_instance: <id> instead
    #   dms:
    #     tasks: [orders-to-dw, "*"]     # task identifiers or ARNs; "*" = every task the profile sees
    #     latency_warn_secs: 300         # the CDC latency the overview warns at
  - name: prod-reader
    dsn: env:PROD_READER_DSN
    tags: [prod, aurora, reader, env:prod, team:orders]
    # disabled: [<collection>]         # collections this instance never runs; names are
    #                                  # checked against `pgvigil collect` 's known list at start
