name: ci

on:
  push:
    branches: [main, phase1]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["13", "16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: pgvigil
          POSTGRES_DB: pgvigil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: go test, with the repository-backed tests (fixture imports on this PostgreSQL)
        env:
          PGVIGIL_REPO_DSN: postgres://postgres:pgvigil@localhost:5432/pgvigil?sslmode=disable
        run: go test ./...
      - run: go build -o bin/pgvigil ./cmd/pgvigil
      - name: integration (migrate, collect as pg_monitor, settings history)
        env:
          PGVIGIL_REPO_DSN: postgres://postgres:pgvigil@localhost:5432/pgvigil?sslmode=disable
          ADMIN_DSN: postgres://postgres:pgvigil@localhost:5432/postgres?sslmode=disable
        run: scripts/integration.sh
      - name: dbstats and iostats (the rates; the pg_stat_io split, skipped below PG 16)
        env:
          PGVIGIL_REPO_DSN: postgres://postgres:pgvigil@localhost:5432/pgvigil?sslmode=disable
          ADMIN_DSN: postgres://postgres:pgvigil@localhost:5432/postgres?sslmode=disable
        run: scripts/proof-dbstats.sh
      - name: UI login and TLS listen (migration 0015, pgvigil user, pgvigil cert)
        env:
          PGVIGIL_REPO_DSN: postgres://postgres:pgvigil@localhost:5432/pgvigil?sslmode=disable
        run: scripts/proof-auth.sh
      - name: storage collection and forecasts (migration 0033; the container and Aurora parts skip here)
        env:
          PGVIGIL_REPO_DSN: "host=localhost port=5432 user=postgres password=pgvigil dbname=postgres sslmode=disable"
        run: scripts/proof-storage.sh
      - name: the -open switch (serve and demo open an app-mode window; stub browsers)
        env:
          PGVIGIL_REPO_DSN: "host=localhost port=5432 user=postgres password=pgvigil dbname=postgres sslmode=disable"
        run: scripts/proof-open.sh
      - name: long runs and idle transactions over a window (migration 0048; two samples 65 s apart)
        env:
          PGVIGIL_REPO_DSN: postgres://postgres:pgvigil@localhost:5432/pgvigil?sslmode=disable
          ADMIN_DSN: postgres://postgres:pgvigil@localhost:5432/postgres?sslmode=disable
        run: scripts/proof-window.sh
      - name: database information (migration 0046, 0050; the Database info tab's data and API)
        env:
          PGVIGIL_REPO_DSN: "host=localhost port=5432 user=postgres password=pgvigil dbname=postgres sslmode=disable"
        run: scripts/proof-dbinfo.sh
      - name: the drill-down pages (migration 0047; A the read functions, B the API; C needs a browser and stays local)
        env:
          PGVIGIL_ADMIN_DSN: "host=localhost port=5432 user=postgres password=pgvigil dbname=postgres sslmode=disable"
          PGVIGIL_PROOF_NO_RENDER: "1"   # the runner has a chromium that aborts at start; C runs locally
        run: scripts/proof-drill.sh
  gov:
    # government readiness (task 50): the FIPS 140-3 build with the login and TLS proof under it, the service units'
    # hardening score, the SBOM against the CycloneDX schema; the accessibility proof (scripts/proof-a11y.sh) and the side
    # tree's render proof (scripts/proof-tree.sh) need a browser and stay local proofs (proof-drill's C the same, skipped above)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pgvigil
          POSTGRES_DB: pgvigil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: FIPS 140-3 build (version line, tests, the UI login and TLS under the FIPS binary)
        env:
          PGVIGIL_REPO_DSN: postgres://postgres:pgvigil@localhost:5432/pgvigil?sslmode=disable
        run: scripts/proof-fips.sh
      - name: service units (systemd-analyze security, the rendered unit against deploy/)
        run: scripts/proof-hardening.sh
      - name: SBOM (CycloneDX 1.6 schema, every module present)
        run: scripts/proof-sbom.sh
  app:
    # the Windows app module (app/, its own go.mod): gofmt, vet and lint on both targets, its tests, and a GOOS=windows
    # build; the release's app job builds and tests it on a Windows runner, this job catches a broken module on every push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          install-only: true
      - name: the app module's gates on both targets
        working-directory: app
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./... && GOOS=windows go vet ./...
          go test ./...
          golangci-lint run ./... && GOOS=windows golangci-lint run ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui" -o /tmp/pgvigil-app.exe .
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0 # pinned to the local golangci-lint; bump on purpose
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0   # the version run locally on 2026-11-09; bump on purpose
      - run: govulncheck ./...
