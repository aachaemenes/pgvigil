name: ci

on:
  push:
    branches: [main, phase1]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["13", "16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: pgvigil
          POSTGRES_DB: pgvigil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: go test, with the repository-backed tests (fixture imports on this PostgreSQL)
        env:
          PGVIGIL_REPO_DSN: postgres://postgres:pgvigil@localhost:5432/pgvigil?sslmode=disable
        run: go test ./...
      - run: go build -o bin/pgvigil ./cmd/pgvigil
      - name: integration (migrate, collect as pg_monitor, settings history)
        env:
          PGVIGIL_REPO_DSN: postgres://postgres:pgvigil@localhost:5432/pgvigil?sslmode=disable
          ADMIN_DSN: postgres://postgres:pgvigil@localhost:5432/postgres?sslmode=disable
        run: scripts/integration.sh
      - name: UI login and TLS listen (migration 0015, pgvigil user, pgvigil cert)
        env:
          PGVIGIL_REPO_DSN: postgres://postgres:pgvigil@localhost:5432/pgvigil?sslmode=disable
        run: scripts/proof-auth.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0 # pinned to the local golangci-lint; bump on purpose
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0   # the version run locally on 2026-11-09; bump on purpose
      - run: govulncheck ./...
