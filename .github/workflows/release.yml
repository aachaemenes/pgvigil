# Release on a tag v*: the tests, static binaries for Linux, Windows and macOS, FIPS 140-3 builds of the
# Linux and Windows ones (GOFIPS140=v1.0.0: the Go Cryptographic Module v1.0.0, CMVP certificate #5247,
# is the only cryptography in them and FIPS mode is on from the start), a CycloneDX SBOM per target, a
# SHA256SUMS file, and a keyless Sigstore signature of that file (the GitHub Actions OIDC identity is the
# signer, recorded in the public Rekor log) with its bundle for an offline verification, all attached to
# the GitHub release, with the Windows app's zip (pgvigil-app.exe beside a pgvigil.exe built on the Windows
# runner from the same source and flags; its hash may differ from the Linux-built exe, and the zip's own
# SHA256SUMS line covers it; not Authenticode-signed, so SmartScreen may warn on first run) and the app's SBOM.
# Nothing is published from a laptop: a release is reproducible from this file and the tag. docs/airgap.md says how a site without Internet access verifies and installs one. The cosign installer
# is pinned: its v4 line changes the signature assets (bundle only).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # the release and its assets
  id-token: write   # the OIDC token cosign signs with (keyless)

jobs:
  app:
    # the Windows app (app/, its own module): tested and built on a Windows runner, zipped with the plain pgvigil.exe of
    # the same source and flags, with its own SBOM; the release job lists both in SHA256SUMS under the one signature.
    # Read-only token: this job only uploads an artifact, so it holds neither the release's write right nor its OIDC identity
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: test and build the Windows app on Windows (the app is its own module; its tests run here, on the target)
        shell: bash
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          (cd app && go mod verify && go vet ./... && go test ./...)
          mkdir -p out
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$V" -o out/pgvigil.exe ./cmd/pgvigil
          (cd app && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$V" -o ../out/pgvigil-app.exe .)
          out/pgvigil-app.exe -version > /dev/null 2>&1 || true   # a windowed program: no console output to check here
          (cd out && 7z a -tzip "../pgvigil-app_${V}_windows_amd64.zip" pgvigil-app.exe pgvigil.exe)
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          (cd app && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 "$(go env GOPATH)/bin/cyclonedx-gomod" app -json -licenses -main . -output "../pgvigil-app_${V}_windows_amd64.cdx.json" .)
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            pgvigil-app_*_windows_amd64.zip
            pgvigil-app_*_windows_amd64.cdx.json
          if-no-files-found: error
  release:
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the SBOM tool reads the module's version from the tag
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./... && go test ./...
      - name: build the binaries (plain, then FIPS 140-3 for Linux and Windows)
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          mkdir -p dist
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64 darwin/amd64; do
            GOOS="${t%/*}"; GOARCH="${t#*/}"; ext=""
            [ "$GOOS" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -X main.version=$V" \
              -o "dist/pgvigil_${V}_${GOOS}_${GOARCH}${ext}" ./cmd/pgvigil
          done
          for t in linux/amd64 linux/arm64 windows/amd64; do
            GOOS="${t%/*}"; GOARCH="${t#*/}"; ext=""
            [ "$GOOS" = windows ] && ext=.exe
            CGO_ENABLED=0 GOFIPS140=v1.0.0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -X main.version=$V" \
              -o "dist/pgvigil_${V}_${GOOS}_${GOARCH}_fips${ext}" ./cmd/pgvigil
          done
          "dist/pgvigil_${V}_linux_amd64_fips" version | tee /dev/stderr | grep -qF 'fips140 on (module v1.0.0)'
          "dist/pgvigil_${V}_linux_amd64" version | tee /dev/stderr | grep -qF 'fips140 off'
      - name: SBOM per target (CycloneDX 1.6; the FIPS build of a target links the same modules)
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64 darwin/amd64; do
            GOOS="${t%/*}"; GOARCH="${t#*/}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" "$(go env GOPATH)/bin/cyclonedx-gomod" app -json -licenses \
              -main cmd/pgvigil -output "dist/pgvigil_${V}_${GOOS}_${GOARCH}.cdx.json" .
          done
          python3 -c 'import json,sys; [json.load(open(f))["bomFormat"] == "CycloneDX" or sys.exit(f) for f in sys.argv[1:]]' dist/*.cdx.json
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: dist
      - name: the app's zip and its SBOM are in dist (their SHA256SUMS lines follow)
        run: ls -l dist/pgvigil-app_*_windows_amd64.zip dist/pgvigil-app_*_windows_amd64.cdx.json
      - name: checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: sigstore/cosign-installer@v3.10.1   # cosign v2.6.1: --bundle beside --output-signature / --output-certificate; the installer's v4 (cosign v3) drops those two flags and writes the new bundle format only, so a bump is a deliberate change of the assets, never a floating tag
      - name: sign the checksums (keyless), with a bundle for an offline verification
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem dist/SHA256SUMS
      - name: verify what was just signed, both ways
        run: |
          cosign verify-blob --signature dist/SHA256SUMS.sig --certificate dist/SHA256SUMS.pem \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/SHA256SUMS
          cosign verify-blob --bundle dist/SHA256SUMS.bundle \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/SHA256SUMS
      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
