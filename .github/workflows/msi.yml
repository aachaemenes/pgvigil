name: msi

# pgvigil's MSI (L189): built on windows-latest by WiX 5.0.2 (pinned in packaging/msi/pgvigil.wixproj; ICE validation
# inside the build) from the tree's own windows/amd64 binary (each package's binary stamped with its own version), then
# proven on the runner: the package holds no custom-action DLL, a silent install makes the service through 'pgvigil
# install', an upgrade over the previous MSI on a CONFIGURED host whose service stops at once still ends 0 with the
# new binary in place (rn-l189 B1), a downgrade is refused, an uninstall removes the service and the program and
# keeps the configuration. Not yet a release asset (docs/msi.md). Unsigned until the code-signing certificate's secret
# exists; only the signing step would read it.

on:
  workflow_dispatch:
  push:
    paths: &msipaths
      - .github/workflows/msi.yml
      - packaging/msi/**
      - cmd/pgvigil/**
      - internal/**
      - go.mod
      - go.sum
      - docs/install.ps1
      - deploy/install.ps1
  pull_request:
    paths: *msipaths

permissions:
  contents: read

concurrency:
  group: msi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the windows/amd64 binary of this tree, once per package version (rn-l189 S2 - an upgrade that did not replace the file shows)
        shell: bash
        run: |
          for v in 0.0.1 0.0.2; do
            mkdir -p "out/bin-$v"
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-X main.version=$v" -o "out/bin-$v/pgvigil.exe" ./cmd/pgvigil
          done
      - name: two packages - the previous version (0.0.1) and this one (0.0.2)
        shell: pwsh
        run: |
          foreach ($ver in '0.0.1', '0.0.2') {
            $bin = (Resolve-Path "out/bin-$ver/pgvigil.exe").Path
            dotnet build packaging/msi/pgvigil.wixproj -c Release "-p:PgvVersion=$ver" "-p:PgvBinary=$bin" -o "out/msi-$ver"
            if ($LASTEXITCODE -ne 0) { throw "the MSI build of $ver exited with $LASTEXITCODE" }
          }
          Get-ChildItem out/msi-*/*.msi | Format-Table Name, Length
      - name: the package holds no custom-action DLL (its Binary table is empty or absent)
        shell: pwsh
        run: |
          $msi = (Resolve-Path out/msi-0.0.2/pgvigil-0.0.2-x64.msi).Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          # rn-l189 S1: the table's presence from _Tables first; a failure of any read after that fails the step (a
          # broken COM read never passes as an absent table)
          function Read-Column([string]$sql) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
            $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $vals = @()
            while ($true) {
              $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
              if (-not $rec) { break }
              $vals += $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, 1)
            }
            return , $vals
          }
          $tables = Read-Column "SELECT ``Name`` FROM ``_Tables`` WHERE ``Name`` = 'Binary'"
          if ($tables.Count -eq 0) { Write-Host 'Binary table: absent'; exit 0 }
          $names = Read-Column 'SELECT `Name` FROM `Binary`'
          if ($names.Count -gt 0) { throw "the MSI's Binary table holds $($names -join ', '): no custom-action DLL may ship (M1)" }
          Write-Host 'Binary table: empty'
      - name: silent install of the previous version
        shell: pwsh
        run: |
          # N8: each path element quoted, so a copy of these lines under a path with a space still holds
          $proc = Start-Process msiexec -ArgumentList '/i', ('"{0}"' -f (Resolve-Path out/msi-0.0.1/pgvigil-0.0.1-x64.msi).Path), '/qn', '/norestart', '/l*v', 'out\install-1.log' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Get-Content out\install-1.log -Tail 60; throw "install of 0.0.1 exited with $($proc.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'pgvigil\pgvigil.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "$exe is missing after the install" }
          Get-Service pgvigil | Format-List Name, Status, StartType
          & $exe version
      - name: the host configured with a repository that never answers (rn-l189 B1 - the new service stops at once)
        shell: pwsh
        run: |
          $dsn = Join-Path $env:ProgramData 'pgvigil\repo.dsn'
          Set-Content -LiteralPath $dsn -Value 'host=pgvigil-none.invalid dbname=x user=x connect_timeout=2' -Encoding ascii
      - name: an upgrade over it
        shell: pwsh
        run: |
          $proc = Start-Process msiexec -ArgumentList '/i', ('"{0}"' -f (Resolve-Path out/msi-0.0.2/pgvigil-0.0.2-x64.msi).Path), '/qn', '/norestart', '/l*v', 'out\install-2.log' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Get-Content out\install-2.log -Tail 60; throw "the upgrade to 0.0.2 on a configured host whose service stops at once exited with $($proc.ExitCode) (B1: the start's failure must not roll the upgrade back)" }
          $installed = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -eq 'pgvigil' })
          if ($installed.Count -ne 1 -or $installed[0].DisplayVersion -ne '0.0.2') { throw "after the upgrade: $($installed | ForEach-Object DisplayVersion) installed, want 0.0.2 alone" }
          $exe = Join-Path $env:ProgramFiles 'pgvigil\pgvigil.exe'
          $said = "$(& $exe version)"
          if ($said -notmatch '\b0\.0\.2\b') { throw "after the upgrade pgvigil.exe says '$said': the file was not replaced (S2)" }
          $svc = Get-CimInstance Win32_Service -Filter "Name='pgvigil'"
          if (-not $svc) { throw 'the service pgvigil is gone after the upgrade (B1)' }
          if ($svc.PathName -notlike "*$exe*") { throw "the service runs '$($svc.PathName)', not the MSI's own $exe (S2)" }
          Write-Host "after the upgrade: $said; the service $($svc.State), $($svc.PathName)"
      - name: a downgrade is refused
        shell: pwsh
        run: |
          $proc = Start-Process msiexec -ArgumentList '/i', ('"{0}"' -f (Resolve-Path out/msi-0.0.1/pgvigil-0.0.1-x64.msi).Path), '/qn', '/norestart', '/l*v', 'out\downgrade.log' -Wait -PassThru
          if ($proc.ExitCode -eq 0) { throw 'the downgrade to 0.0.1 was accepted: MajorUpgrade must refuse it' }
          # N6: refused for the downgrade's own reason, not any failure
          if (-not (Select-String -LiteralPath out\downgrade.log -SimpleMatch 'A newer pgvigil is installed' -Quiet)) { throw "the downgrade exited $($proc.ExitCode) without the MajorUpgrade refusal in its log" }
          $installed = @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -eq 'pgvigil' })
          if ($installed.Count -ne 1 -or $installed[0].DisplayVersion -ne '0.0.2') { throw "after the refused downgrade: $($installed | ForEach-Object DisplayVersion) installed, want 0.0.2 alone" }
          Write-Host "the downgrade was refused with exit code $($proc.ExitCode)"
      - name: install.ps1 refuses this MSI machine
        shell: pwsh
        run: |
          $refused = $false
          try { $env:PGVIGIL_NO_SERVICE = ''; & docs/install.ps1 } catch { $refused = "$_" -match 'msiexec'; Write-Host "install.ps1: $_" }
          if (-not $refused) { throw 'docs/install.ps1 did not refuse a machine whose pgvigil came from the MSI' }
      - name: an uninstall removes the service and the program, and keeps the data
        shell: pwsh
        run: |
          $proc = Start-Process msiexec -ArgumentList '/x', ('"{0}"' -f (Resolve-Path out/msi-0.0.2/pgvigil-0.0.2-x64.msi).Path), '/qn', '/norestart', '/l*v', 'out\uninstall.log' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { Get-Content out\uninstall.log -Tail 60; throw "the uninstall exited with $($proc.ExitCode)" }
          if (Get-Service pgvigil -ErrorAction SilentlyContinue) { throw 'the service pgvigil is still there after the uninstall' }
          if (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'pgvigil\pgvigil.exe')) { throw 'pgvigil.exe is still there after the uninstall' }
          # S2: the configuration is kept, asserted
          foreach ($kept in 'pgvigil.yaml', 'repo.dsn') {
            $f = Join-Path $env:ProgramData "pgvigil\$kept"
            if (-not (Test-Path -LiteralPath $f)) { throw "$f is gone after the uninstall: a removal keeps the configuration" }
          }
          Write-Host 'kept under ProgramData: pgvigil.yaml, repo.dsn'
      # N7: the certificate's secret reaches no step but the signing one; an earlier step says only whether it exists
      - name: whether the code-signing secret exists
        id: signable
        shell: bash
        env:
          PGV_SIGN_PFX: ${{ secrets.PGV_SIGN_PFX }}
        run: echo "present=$([ -n "$PGV_SIGN_PFX" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: sign the package (only once the certificate's secret exists)
        if: ${{ steps.signable.outputs.present == 'yes' }}
        shell: pwsh
        env:
          PGV_SIGN_PFX: ${{ secrets.PGV_SIGN_PFX }}
        run: |
          throw 'the signing step is written when the code-signing certificate exists (docs/msi.md): until then the MSI ships unsigned'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pgvigil-msi
          path: |
            out/msi-0.0.2/*.msi
            out/*.log
